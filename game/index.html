<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City: Streets of Gold</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar City: Streets of Gold — an open-world crime game. Drive, steal cars, outrun the police and run six missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
<script type="module">
  import { boot } from './src/main.js';
  const canvas = document.getElementById('game');
  const game = boot(canvas);
  document.getElementById('status').textContent = 'Solmar City loaded. Press Enter to start.';
  window.addEventListener('error', (event) => {
    document.title = 'SOLMAR ERROR: ' + String(event.message).slice(0, 120);
  });
</script>
</body>
</html>
